version: 2

models:
  - name: monthly_revenue
    description: "Monthly aggregated revenue, orders, 
                  and customer metrics. 13 months of data
                  from Dec 2010 to Dec 2011."
    columns:
      - name: YEAR
        description: "Year of the month"
        tests:
          - not_null

      - name: MONTH
        description: "Month number (1-12)"
        tests:
          - not_null

      - name: TOTAL_REVENUE
        description: "Sum of all revenue for that month"
        tests:
          - not_null

      - name: TOTAL_ORDERS
        description: "Total number of orders placed"
        tests:
          - not_null

      - name: UNIQUE_CUSTOMERS
        description: "Count of distinct customers"
        tests:
          - not_null

      - name: TOTAL_ITEMS_SOLD
        description: "Sum of all quantities sold"
        tests:
          - not_null

  - name: top_products
    description: "Top 10 products ranked by total revenue"
    columns:
      - name: STOCKCODE
        description: "Product stock code"
        tests:
          - not_null
          - unique

      - name: DESCRIPTION
        description: "Product description"
        tests:
          - not_null

      - name: TOTAL_REVENUE
        description: "Total revenue generated by this product"
        tests:
          - not_null

      - name: TOTAL_QUANTITY_SOLD
        description: "Total units sold"
        tests:
          - not_null

      - name: TOTAL_ORDERS
        description: "Number of orders containing this product"
        tests:
          - not_null

  - name: country_revenue
    description: "Revenue breakdown by country across 37 countries"
    columns:
      - name: COUNTRY
        description: "Country name"
        tests:
          - not_null
          - unique

      - name: TOTAL_REVENUE
        description: "Total revenue from that country"
        tests:
          - not_null

      - name: TOTAL_ORDERS
        description: "Total orders from that country"
        tests:
          - not_null

      - name: UNIQUE_CUSTOMERS
        description: "Unique customers from that country"
        tests:
          - not_null

  - name: customer_segments
    description: "RFM customer segmentation — 4338 customers
                  segmented into VIP, LOYAL, AT_RISK, DORMANT"
    columns:
      - name: CUSTOMERID
        description: "Unique customer identifier"
        tests:
          - not_null
          - unique

      - name: RECENCY
        description: "Days since last purchase"
        tests:
          - not_null

      - name: FREQUENCY
        description: "Number of unique orders placed"
        tests:
          - not_null

      - name: MONETARY
        description: "Total revenue generated by customer"
        tests:
          - not_null

      - name: R_SCORE
        description: "Recency score 1-4"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]

      - name: F_SCORE
        description: "Frequency score 1-4"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]

      - name: M_SCORE
        description: "Monetary score 1-4"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]

      - name: SEGMENT
        description: "Customer segment — VIP, LOYAL, AT_RISK, DORMANT"
        tests:
          - not_null
          - accepted_values:
              values: ['VIP', 'LOYAL', 'AT_RISK', 'DORMANT']